<circle cx="1085" cy="150" r="15" fill="#8CBEE1" opacity=".10" class="halo"/><circle cx="1085" cy="150" r="8" fill="#182C42" stroke="#8CBEE1" stroke-width="2.2"/><text x="1085" y="180" text-anchor="middle" class="lab">SPLUNK</text>
