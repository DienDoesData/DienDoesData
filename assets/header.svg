<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Dien Elsayed. IT Support, Security Operations, Solutions Engineering. I run the tech behind two small businesses in St. Pete and help others automate theirs. Security+, Network+, Splunk Core Certified User, Azure Fundamentals. Clearable.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121E2E"/><stop offset="1" stop-color="#1C3550"/></linearGradient>
<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#96B9D7"/></pattern>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".45" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
<mask id="m"><rect width="1200" height="340" fill="url(#fade)"/></mask>
<clipPath id="r"><rect width="1200" height="340" rx="16"/></clipPath>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
.name{font-size:62px;font-weight:800;fill:#fff;letter-spacing:-.5px}
.role{font-size:21px;font-weight:600;fill:#A9D4F5;letter-spacing:.4px}
.tag{font-size:19px;fill:#D5E3F0}
.chip{font:600 14.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#E6F1FA}
.lab{font:600 10.5px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#A9C6DE;letter-spacing:1.4px}
@keyframes halo{0%,100%{opacity:.06}50%{opacity:.24}}
.halo{animation:halo 3.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.a1{animation:rise .7s ease-out .1s both}.a2{animation:rise .7s ease-out .4s both}.a3{animation:rise .7s ease-out .7s both}.a4{animation:rise .7s ease-out 1s both}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#r)">
<rect width="1200" height="340" fill="url(#bg)"/>
<rect width="1200" height="340" fill="url(#dots)" mask="url(#m)"/>
</g>
